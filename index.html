<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE E-KIOSK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img
        src="https://www.gsma.com/get-involved/gsma-membership/wp-content/uploads/2014/06/one_logo-002.png"
        class="background-logo"
        alt="Background Logo"
    >

    <div class="language-switch">
        <img src="https://flagcdn.com/w40/al.png" alt="Albanian" class="flag" onclick="setLanguage('sq')">
        <img src="https://flagcdn.com/w40/gb.png" alt="English" class="flag" onclick="setLanguage('en')">
    </div>

    <!-- FIRST PAGE -->
    <div class="container" id="homePage">

        <img
            src="https://www.gsma.com/get-involved/gsma-membership/wp-content/uploads/2014/06/one_logo-002.png"
            alt="One Albania Logo"
            class="logo"
        >

        <h1 id="mainTitle">ONE E-KIOSK</h1>

        <p class="subtitle" id="subtitle">
            Fast. Simple. Efficient.
        </p>

        <button class="start-btn" onclick="showPhonePage()" id="startBtn">
            Start
        </button>

    </div>

    <!-- PHONE NUMBER PAGE -->
    <div class="auth-page" id="phonePage">

        <div class="auth-card">

            <h2 id="phoneTitle">Enter your mobile number</h2>

            <p id="phoneSubtitle">
                We will send you an OTP for verification
            </p>

            <div class="phone-input-box">
                <span class="phone-icon">📱</span>
                <span class="country-code">+355</span>

                <input
                    type="text"
                    id="phoneNumber"
                    placeholder="68 123 4567"
                    maxlength="12"
                >
            </div>

            <button class="primary-btn" onclick="showOtpPage()" id="sendOtpBtn">
                Send OTP
            </button>

            <button class="back-btn" onclick="goHome()" id="backHomeBtn">
                Back to Home
            </button>

        </div>

    </div>

    <!-- OTP PAGE -->
    <div class="auth-page" id="otpPage">

        <div class="auth-card">

            <h2 id="otpTitle">Enter OTP</h2>

            <p id="otpSubtitle">
                We have sent a 6-digit code to your phone
            </p>

            <div class="otp-boxes">

                <input class="otp-input" maxlength="1" type="text">
                <input class="otp-input" maxlength="1" type="text">
                <input class="otp-input" maxlength="1" type="text">
                <input class="otp-input" maxlength="1" type="text">
                <input class="otp-input" maxlength="1" type="text">
                <input class="otp-input" maxlength="1" type="text">

            </div>

            <p class="otp-hint" id="otpHint">
                Demo OTP: 123456
            </p>

            <button class="primary-btn" onclick="showDashboard()" id="verifyBtn">
                Verify
            </button>

            <button class="back-btn" onclick="goPhonePage()" id="backBtn">
                Back
            </button>

        </div>

    </div>

    <!-- DASHBOARD PAGE -->
    <div class="dashboard-page" id="dashboardPage">

        <div class="welcome-section">

            <h2 id="dashboardTitle">
                Welcome to One Albania
            </h2>

            <p id="dashboardSubtitle">
                Your digital self-service hub
            </p>

        </div>

        <div class="dashboard-grid">

            <button class="dashboard-card" id="payBillCard">
                Pay Bill
            </button>

            <button class="dashboard-card" id="buyPackageCard">
                Buy Package
            </button>

            <button class="dashboard-card" id="submitComplaintCard">
                Submit Complaint
            </button>

            <button class="dashboard-card" id="checkCoverageCard">
                Check Coverage
            </button>

            <button class="dashboard-card" id="bookAppointmentCard">
                Book Appointment
            </button>

            <button class="dashboard-card" id="trackRequestCard">
                Track Request
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
